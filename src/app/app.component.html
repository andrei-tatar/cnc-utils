<div class="app">
  <app-toolbar
    [working]="(isWorking$ | async) ?? false"
    [projects]="(store.projects$ | async) ?? []"
    [project]="(store.project$ | async) ?? null"
    [pending]="(store.pending$ | async) ?? false"
    [canUndo]="(history.state$ | async)?.canUndo ?? false"
    [canRedo]="(history.state$ | async)?.canRedo ?? false"
    (undo)="history.undo()"
    (redo)="history.redo()"
    (save)="projects.save()"
    (saveAs)="projects.saveAs()"
    (openProject)="projects.openProject($event)"
    (deleteProject)="projects.delete($event)"
    (projectsOpened)="store.refreshProjects()"
    (newProject)="projects.newProject()"
    (openTemplate)="projects.openTemplate($event)"
    (load)="store.open()"
    (download)="cam.download()"
    (downloadPerTool)="cam.downloadPerTool()"
    [jobActions]="jobActions"
    (jobAction)="onJobAction($event)"
  />

  <div class="layout" [class.resizing]="resizing()">
    <aside class="editor" [style.width.px]="editorWidth()">
      <div class="editor_content">
        <app-model-editor
          [model]="store.value"
          (modelChange)="store.set($event)"
        />
      </div>
    </aside>

    <app-editor-divider [(width)]="editorWidth" [(resizing)]="resizing" />

    <app-viewer
      [shapes]="cam.shapes$"
      [paths]="cam.paths$"
      [highlight]="(cam.highlight$ | async) ?? NO_HIGHLIGHT"
      [hiddenShapes]="(cam.hiddenShapes$ | async) ?? []"
      [stock]="cam.stock$ | async"
      [time]="cam.time$ | async"
      [checks]="cam.warnings$ | async"
      [clampShapes]="cam.clampShapes$ | async"
      [simulation]="cam.simulation$ | async"
      [simulating]="(cam.simulate$ | async) ?? false"
      (simulateChange)="cam.simulate$.next($event)"
      [simulationQuality]="(cam.simulationQuality$ | async) ?? 'standard'"
      (simulationQualityChange)="cam.setSimulationQuality($event)"
      [models]="cam.models$ | async"
      [editing]="cam.editing$ | async"
      (shapeSelect)="onShapeSelect($event)"
      (shapeMove)="onShapeMove($event)"
      (pointMove)="onPointMove($event)"
    />
  </div>
</div>

@if (dropping()) {
  <div class="drop-zone" aria-hidden="true">
    <div class="drop-zone_message">
      <strong>Drop to open</strong>
      <span>An .svg file becomes a new shape</span>
      <span>An .stl or .3mf file becomes a new 3D model</span>
      <span>A .nc file’s project replaces this one</span>
    </div>
  </div>
}

<app-error-toast />
<app-update-notice />
