<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CNC Utils</title>
    <meta
      name="description"
      content="Browser-based CAM: design shapes, set up tools and operations, preview toolpaths in 3D and download G-code."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- ICO for older browsers; sizes="32x32" stops Chrome preferring it. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#141b2d" />
    <!-- Roboto Mono: expressions in number fields (--code-font). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
    />
    <!-- The splash shown until the app renders (Angular replaces what's in
         <app-root>). Inline, so it's up as soon as the page arrives. The
         spinner turns by transform, which keeps going while the app's
         first render keeps the main thread busy. -->
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #eef1f5;
        color: #5b6475;
        font:
          14px Roboto,
          "Helvetica Neue",
          sans-serif;
      }
      .app-splash_logo {
        width: 64px;
        height: 64px;
      }
      .app-splash_spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #dde2ea;
        border-top-color: #2f80ed;
        border-radius: 50%;
        animation: app-splash-spin 0.8s linear infinite;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash_spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body class="mat-typography">
    <app-root>
      <div class="app-splash" role="status">
        <img class="app-splash_logo" src="favicon.svg" alt="" />
        <div class="app-splash_spinner" aria-hidden="true"></div>
        <div>Loading CNC Utils…</div>
      </div>
    </app-root>
  </body>
</html>
