<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Same depth gradient as the toolpath preview: surface → deepest. -->
    <linearGradient id="depth" gradientUnits="userSpaceOnUse" x1="0" y1="38" x2="0" y2="58">
      <stop offset="0" stop-color="#b3f0ff"/>
      <stop offset="0.5" stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#e040fb"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#141b2d"/>
  <!-- material with a V-carved notch -->
